name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp
      - run: node tests/test_edit_diff.mjs
      - run: node tests/test_history.mjs
      - run: node tests/test_estimates.mjs
      - run: node tests/test_variations.mjs
      - run: node tests/test_compare.mjs
      - run: python -m unittest discover -s tests -v
